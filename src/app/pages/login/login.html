<div class="page-container">
  <div class="login-container">
    <h2>Sign In</h2>

    <form [formGroup]="form" (ngSubmit)="onFormSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" formControlName="username">
        <div *ngIf="fc['username']?.dirty || fc['username']?.touched" class="validation-error-message">
          <span *ngIf="fc['username']?.errors?.['required']">Email is required</span>
          <span *ngIf="fc['username']?.errors?.['email']">Invalid email format</span>
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" formControlName="password">
        <div *ngIf="fc['password']?.dirty || fc['password']?.touched" class="validation-error-message">
          <span *ngIf="fc['password']?.errors?.['required']">Password is required</span>
        </div>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox"> Remember me
        </label>
        <a routerLink="/forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="primary-btn">Log In</button>
    </form>

    <p class="signup-text">
      <span routerLink="/signup">Create account</span>
    </p>
  </div>
</div>
