<div class="profile-page">

  <!-- TOP PROFILE CARD -->
  <div class="profile-header card">

    <div class="profile-left">
      <div class="avatar">
        <img src="https://i.pravatar.cc/150" alt="User">
      </div>

      <div class="user-info">
        <h2>John Doe</h2>
        <p class="email">john@email.com</p>
        <span class="role">Admin</span>
      </div>
    </div>

    <div class="profile-actions">
      <button class="btn edit-btn">Edit Profile</button>
    </div>

  </div>

  <!-- MAIN CONTENT -->
  <div class="profile-content">

    <!-- LEFT SIDE -->
    <div class="left">

      <div class="card">
        <h3>About</h3>
        <p>
          Passionate developer working on real-time chat applications.
          Loves clean UI and scalable architecture.
        </p>
      </div>

      <div class="card">
        <h3>Activity</h3>

        <ul class="activity-list">
          <li>Joined workspace <b>General</b></li>
          <li>Invited 3 members</li>
          <li>Created group <b>Dev Team</b></li>
        </ul>
      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

      <div class="card">
        <h3>Personal Information</h3>

        <div class="grid">
          <div class="field">
            <label>Full Name</label>
            <input value="John Doe">
          </div>

          <div class="field">
            <label>Email</label>
            <input value="john@email.com">
          </div>

          <div class="field">
            <label>Phone</label>
            <input value="9876543210">
          </div>

          <div class="field">
            <label>Location</label>
            <input value="India">
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Social Links</h3>

        <div class="grid">
          <input placeholder="LinkedIn URL">
          <input placeholder="Twitter URL">
          <input placeholder="GitHub URL">
        </div>
      </div>

      <button class="primary-btn save-btn">Save Changes</button>

    </div>

  </div>

</div>
