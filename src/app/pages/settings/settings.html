<div class="settings-page">

  <!-- HEADER -->
  <div class="settings-header">
    <h2>Settings</h2>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab"
         [class.active]="activeTab === 'profile'"
         (click)="activeTab='profile'">
      Profile
    </div>

    <div class="tab"
         [class.active]="activeTab === 'account'"
         (click)="activeTab='account'">
      Account
    </div>

    <div class="tab"
         [class.active]="activeTab === 'appearance'"
         (click)="activeTab='appearance'">
      Appearance
    </div>
  </div>

  <!-- CONTENT -->
  <div class="tab-content">

    <!-- PROFILE -->
    @if (activeTab === 'profile') {
      <div class="card">

        <h3>Personal Info</h3>

        <div class="grid">
          <input placeholder="Full Name">
          <input placeholder="Email">
          <input placeholder="Phone">
          <input placeholder="Location">
          <textarea placeholder="Bio" class="full"></textarea>
        </div>

        <h3>Social Links</h3>

        <div class="grid">
          <input placeholder="LinkedIn">
          <input placeholder="Twitter">
          <input placeholder="GitHub">
        </div>

        <button class="primary-btn">Save Changes</button>
      </div>
    } @else if (activeTab === 'account') {
      <!-- ACCOUNT -->
      <div class="card">

        <h3>Password</h3>

        <div class="grid">
          <input type="password" placeholder="Current Password">
          <input type="password" placeholder="New Password">
          <input type="password" placeholder="Confirm Password">
        </div>

        <h3>Security</h3>

        <div class="grid">
          <select>
            <option>2FA Disabled</option>
            <option>2FA Enabled</option>
          </select>
        </div>

        <div class="danger-box">
          <div>
            <h4>Delete Account</h4>
            <p>This action is permanent</p>
          </div>
          <button class="danger-btn">Delete</button>
        </div>

        <button class="primary-btn">Update Security</button>
      </div>
    } @else {
      <!-- APPEARANCE -->
      <div class="card">

        <h3>Theme</h3>

        <div class="grid">
          <select>
            <option>Light</option>
            <option>Dark</option>
          </select>

          <input type="color">
        </div>

        <h3>Preferences</h3>

        <div class="checkbox-group">
          <label><input type="checkbox"> Compact Mode</label>
          <label><input type="checkbox"> Reduce Motion</label>
          <label><input type="checkbox"> Show Tooltips</label>
        </div>

        <button class="primary-btn">Save Preferences</button>
      </div>
    }

  </div>
</div>
