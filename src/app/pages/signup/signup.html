<div class="page-container">
    <div class="login-container">
        <h2>Sign Up</h2>

        <form [formGroup]="form" (ngSubmit)="onFormSubmit()">
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Name" formControlName="name">
                <div *ngIf="fc['name']?.dirty || fc['name']?.touched" class="validation-error-message">
                    <span *ngIf="fc['name']?.errors?.['required']">Name is required</span>
                </div>
            </div>
            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" formControlName="email">
                <div *ngIf="fc['email']?.dirty || fc['email']?.touched" class="validation-error-message">
                    <span *ngIf="fc['email']?.errors?.['required']">Email is required</span>
                    <span *ngIf="fc['email']?.errors?.['email']">Invalid email format</span>
                </div>
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" formControlName="password">
                <div *ngIf="fc['password']?.dirty || fc['password']?.touched" class="validation-error-message">
                    <span *ngIf="fc['password']?.errors?.['required']">Password is required</span>
                </div>
            </div>

            <button type="submit" class="primary-btn">Create Account</button>
        </form>

        <p class="signup-text">
            Already have an account? <span routerLink="/login">Sign in</span>
        </p>
    </div>
</div>
