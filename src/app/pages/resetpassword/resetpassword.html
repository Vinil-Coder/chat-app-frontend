<div class="reset-container">
  <div class="reset-card">

    <div class="header">
      <h2>Reset Password</h2>
      <p>Create a new password for your account</p>
    </div>

    <form class="reset-form" [formGroup]="form" (ngSubmit)="onFormSubmit()">

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter new password" formControlName="email"/>
        <div *ngIf="fc['email']?.dirty || fc['email']?.touched" class="validation-error-message">
          <span *ngIf="fc['email']?.errors?.['required']">Email is required</span>
          <span *ngIf="fc['email']?.errors?.['email']">Invalid email format</span>
        </div>
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" placeholder="Enter new password" formControlName="password"/>
         <div *ngIf="fc['password']?.dirty || fc['password']?.touched" class="validation-error-message">
          <span *ngIf="fc['password']?.errors?.['required']">Password is required</span>
        </div>
      </div>

      <button class="reset-btn">Update Password</button>

      <div class="footer">
        <a routerLink="/login">Back to Login</a>
      </div>

    </form>

  </div>
</div>
