<div class="layout-container">

  <app-sidemenu 
    id="side-bar"
    [class.mobile-view]="isMobile"
    [class.hide]="isSidebarHidden" 
    (toggleSidebar)="toggleSidebar()">
  </app-sidemenu>

  <app-top-bar id="top-bar" (toggleSidebar)="toggleSidebar()" [class.full-screen]="isContentFull">
  </app-top-bar>

  <main id="main" [class.full-screen]="isContentFull">
    <router-outlet></router-outlet>
    <app-modal-host></app-modal-host>
  </main>
</div>
