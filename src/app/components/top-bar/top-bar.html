<header class="top-bar">

  <!-- LEFT: Hamburger -->
  <div class="left">
    <button class="icon-btn hamburger" (click)="toggleSidemenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- SEARCH -->
    <!-- <div class="search-box">
      <input type="text" placeholder="Search..." />
      <img src="assets/search.svg" />
    </div> -->
  </div>

  <!-- RIGHT -->
  <div class="right">

    <!-- DARK MODE -->
    <!-- <button class="icon-btn" (click)="toggleDarkMode()">
      <img src="assets/moon.svg" />
    </button> -->

    <!-- NOTIFICATIONS -->
    <div class="icon-dropdown" (click)="toggleDropdown('notifications')">

      <button class="icon-btn">
        <img src="assets/bell.svg" />
        <span class="badge">3</span>
      </button>

      @if(activeDropdown === 'notifications') {
        <div class="dropdown-panel">
          <p>🔔 New message received</p>
          <p>📢 System update available</p>
          <p>⚡ Build deployed successfully</p>
        </div>
      }
    </div>

    <!-- PROFILE -->
    <div class="icon-dropdown" (click)="toggleDropdown('profile')">

     
      <div class="profile-info">
        <img src="assets/avatar.svg" />
        <span>{{ appState.getUser()?.name }}</span>
      </div>

      @if(activeDropdown === 'profile') {
      <div class="dropdown-panel profile">
        <p routerLink="/chats">Chats</p>
        <p routerLink="/groups">Groups</p>
        <p routerLink="/invites">Requests</p>
        <p routerLink="/contacts">Contacts</p>
        <p (click)="logoutUser()">Logout</p>
      </div>
      }

    </div>

  </div>

</header>
