<div class="modal-backdrop" (click)="close()"></div>
<div class="modal">
    <form [formGroup]="form" (ngSubmit)="save()">
        <h3 [ngClass]="mode">{{ mode === 'edit' ? 'Edit Workspace' : mode === 'delete' ? 'Delete' : 'Workspace' }}</h3>

        @if (mode === 'delete') {
            <p>Are you sure you want to delete this workspace ?</p>
        } @else {
            <div class="form-field">
                <label for="name">Name</label>
                <input placeholder="Workspace name" formControlName="name" type="text" />
                @if(fc['name']?.dirty || fc['name']?.touched) {
                    <div class="validation-error-message">
                        @if(fc['name']?.errors?.['required']) {
                            Name is required
                        }
                    </div>
                }
            </div>

            <div class="form-field">
                <label for="description">Description</label>
                <input placeholder="Description" formControlName="description" type="text" />
            </div>

        }
        <div class="modal-actions">
            <button (click)="save()" class="btn btn-primary" type="button">
                {{ mode === 'delete' ? 'Yes' : mode === 'edit' ? 'Save' : 'Create'}}</button>
            <button (click)="close()" class="btn btn-danger" type="button">
                No
            </button>
        </div>
    </form>
</div>
